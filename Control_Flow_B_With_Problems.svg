<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1585" viewBox="0 0 960 1585" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif"><rect width="960" height="1585" fill="#FFFFFF"/><defs><marker id="ah-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7480"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B3261E"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker><marker id="ah-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F3A5F"/></marker><marker id="ah-rework" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B0741B"/></marker></defs><text x="40" y="50" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="21" font-weight="800" fill="#1A1A1A">B · Control with problems</text><text x="40" y="72" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13" fill="#5B6573">The OE gate is a real choice: design can fail and the team still decides whether to test OE.</text><rect x="31" y="85" width="18" height="14" rx="3" fill="#1F3A5F"/><text x="55" y="96" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="11.5" fill="#1A1A1A">Workstep</text><rect x="135.0" y="85" width="18" height="14" rx="3" fill="#2E7D6F"/><text x="159.0" y="96" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="11.5" fill="#1A1A1A">Test of One</text><rect x="263.0" y="85" width="18" height="14" rx="3" fill="#2F6DA8"/><text x="287.0" y="96" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="11.5" fill="#1A1A1A">Form</text><rect x="335.0" y="85" width="18" height="14" rx="3" fill="#B0741B"/><text x="359.0" y="96" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="11.5" fill="#1A1A1A">Annotate</text><polygon points="448.0,85 457.0,92 448.0,99 439.0,92" fill="#fff" stroke="#1F3A5F" stroke-width="1.4"/><text x="463.0" y="96" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="11.5" fill="#1A1A1A">Decision</text><rect x="543.0" y="85" width="18" height="14" rx="3" fill="#B3261E"/><text x="567.0" y="96" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="11.5" fill="#1A1A1A">Finding</text><rect x="250.0" y="130.0" width="120" height="40" rx="20.0" ry="20.0" fill="#5B6573"/><text x="310.0" y="152.4" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13" font-weight="600" fill="#fff">Start</text><line x1="310.0" y1="170.0" x2="310.0" y2="205.0" stroke="#6B7480" stroke-width="1.8" marker-end="url(#ah-gray)"/><rect x="145.0" y="206.0" width="330" height="56" rx="9" ry="9" fill="#1F3A5F"/><text x="310.0" y="236.4" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13" font-weight="600" fill="#fff">Set up workstep</text><line x1="310.0" y1="262.0" x2="310.0" y2="296.0" stroke="#6B7480" stroke-width="1.8" marker-end="url(#ah-gray)"/><rect x="145.0" y="297.0" width="330" height="66" rx="9" ry="9" fill="#2E7D6F"/><text x="310.0" y="315.9" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13" font-weight="600" fill="#fff">Test of One — walk one instance,</text><text x="310.0" y="332.4" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13" font-weight="600" fill="#fff">define attributes</text><text x="310.0" y="349.9" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="10.5" font-style="italic" fill="#fff" opacity="0.85">a gap here is an early warning</text><line x1="310.0" y1="363.0" x2="310.0" y2="406.0" stroke="#6B7480" stroke-width="1.8" marker-end="url(#ah-gray)"/><rect x="145.0" y="407.0" width="330" height="66" rx="9" ry="9" fill="#2F6DA8"/><text x="310.0" y="434.2" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13" font-weight="600" fill="#fff">Design assessment —</text><text x="310.0" y="450.7" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13" font-weight="600" fill="#fff">methods, walkthrough, 5Ws + H</text><line x1="310.0" y1="473.0" x2="310.0" y2="505.0" stroke="#6B7480" stroke-width="1.8" marker-end="url(#ah-gray)"/><polygon points="310,506.0 385.0,552 310,598.0 235.0,552" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="1.6"/><text x="310.0" y="546.2" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1F3A5F">Design</text><text x="310.0" y="562.2" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1F3A5F">effective?</text><path d="M385.0,552.0 L460.0,552.0 L460.0,519.0 L530.0,519.0" fill="none" stroke="#B3261E" stroke-width="1.8" marker-end="url(#ah-red)"/><text x="422.5" y="546.0" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="11" font-weight="600" fill="#B3261E">No</text><rect x="530.0" y="493.0" width="300" height="54" rx="9" ry="9" fill="#B3261E"/><text x="680.0" y="522.4" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13" font-weight="600" fill="#fff">Raise design finding (Issue)</text><path d="M680.0,547 L680.0,632 L310.0,632" fill="none" stroke="#B3261E" stroke-width="1.8" marker-end="url(#ah-red)"/><text x="500" y="625" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="11" font-weight="600" fill="#B3261E">ineffective design — still decide on OE</text><line x1="310.0" y1="598.0" x2="310.0" y2="647.0" stroke="#2E7D32" stroke-width="1.8" marker-end="url(#ah-green)"/><rect x="315.0" y="614.0" width="34.6" height="17" rx="3" fill="#fff" opacity="0.92"/><text x="320.0" y="626.5" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="11" font-weight="600" fill="#2E7D32">Yes</text><polygon points="310,648.0 404.0,700 310,752.0 216.0,700" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="1.6"/><text x="310.0" y="686.2" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1F3A5F">Perform OE</text><text x="310.0" y="702.2" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1F3A5F">testing? (you</text><text x="310.0" y="718.2" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1F3A5F">decide)</text><path d="M404.0,700.0 L470.0,700.0 L470.0,699.0 L530.0,699.0" fill="none" stroke="#6B7480" stroke-width="1.8" marker-end="url(#ah-gray)"/><text x="437.0" y="694.0" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="11" font-weight="600" fill="#6B7480">No</text><rect x="530.0" y="668.0" width="300" height="64" rx="9" ry="9" fill="#2F6DA8"/><text x="680.0" y="694.2" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13" font-weight="600" fill="#fff">Document reason —</text><text x="680.0" y="710.7" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13" font-weight="600" fill="#fff">OE not performed</text><path d="M830.0,700 L905.0,700 L905.0,1278 L475.0,1278" fill="none" stroke="#6B7480" stroke-width="1.8" marker-end="url(#ah-gray)"/><line x1="310.0" y1="752.0" x2="310.0" y2="809.0" stroke="#2E7D32" stroke-width="1.8" marker-end="url(#ah-green)"/><rect x="315.0" y="772.0" width="34.6" height="17" rx="3" fill="#fff" opacity="0.92"/><text x="320.0" y="784.5" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="11" font-weight="600" fill="#2E7D32">Yes</text><rect x="145.0" y="810.0" width="330" height="56" rx="9" ry="9" fill="#2F6DA8"/><text x="310.0" y="840.4" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13" font-weight="600" fill="#fff">Plan sample (population, method)</text><line x1="310.0" y1="866.0" x2="310.0" y2="900.0" stroke="#6B7480" stroke-width="1.8" marker-end="url(#ah-gray)"/><rect x="145.0" y="901.0" width="330" height="66" rx="9" ry="9" fill="#B0741B"/><text x="310.0" y="928.2" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13" font-weight="600" fill="#fff">Annotate — build samples,</text><text x="310.0" y="944.7" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13" font-weight="600" fill="#fff">mark up evidence, results matrix</text><line x1="310.0" y1="967.0" x2="310.0" y2="999.0" stroke="#6B7480" stroke-width="1.8" marker-end="url(#ah-gray)"/><polygon points="310,1000.0 385.0,1046 310,1092.0 235.0,1046" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="1.6"/><text x="310.0" y="1040.2" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1F3A5F">Exceptions</text><text x="310.0" y="1056.2" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1F3A5F">found?</text><path d="M385.0,1046.0 L460.0,1046.0 L460.0,1021.0 L530.0,1021.0" fill="none" stroke="#B3261E" stroke-width="1.8" marker-end="url(#ah-red)"/><text x="422.5" y="1040.0" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="11" font-weight="600" fill="#B3261E">Yes</text><rect x="530.0" y="995.0" width="300" height="54" rx="9" ry="9" fill="#B3261E"/><text x="680.0" y="1024.4" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13" font-weight="600" fill="#fff">Raise OE finding (Issue)</text><line x1="680.0" y1="1049.0" x2="680.0" y2="1089.0" stroke="#B3261E" stroke-width="1.8" marker-end="url(#ah-red)"/><rect x="530.0" y="1090.0" width="300" height="56" rx="9" ry="9" fill="#2F6DA8"/><text x="680.0" y="1120.4" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13" font-weight="600" fill="#fff">OE conclusion = Ineffective</text><path d="M680.0,1146 L600,1146 L600,1300 L475.0,1300" fill="none" stroke="#B3261E" stroke-width="1.8" marker-end="url(#ah-red)"/><line x1="310.0" y1="1092.0" x2="310.0" y2="1149.0" stroke="#2E7D32" stroke-width="1.8" marker-end="url(#ah-green)"/><rect x="315.0" y="1112.0" width="26.4" height="17" rx="3" fill="#fff" opacity="0.92"/><text x="320.0" y="1124.5" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="11" font-weight="600" fill="#2E7D32">No</text><rect x="145.0" y="1150.0" width="330" height="56" rx="9" ry="9" fill="#2F6DA8"/><text x="310.0" y="1180.4" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13" font-weight="600" fill="#fff">OE conclusion = Effective</text><line x1="310.0" y1="1206.0" x2="310.0" y2="1254.0" stroke="#6B7480" stroke-width="1.8" marker-end="url(#ah-gray)"/><rect x="145.0" y="1255.0" width="330" height="66" rx="9" ry="9" fill="#1F3A5F"/><text x="310.0" y="1290.4" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13" font-weight="600" fill="#fff">Conclude workstep &amp; submit</text><line x1="310.0" y1="1321.0" x2="310.0" y2="1363.0" stroke="#6B7480" stroke-width="1.8" marker-end="url(#ah-gray)"/><rect x="160.0" y="1364.0" width="300" height="56" rx="9" ry="9" fill="#5B6573"/><text x="310.0" y="1394.4" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13" font-weight="600" fill="#fff">Reviewer</text><line x1="310.0" y1="1420.0" x2="310.0" y2="1448.0" stroke="#2E7D32" stroke-width="1.8" marker-end="url(#ah-green)"/><rect x="315.0" y="1425.5" width="83.8" height="17" rx="3" fill="#fff" opacity="0.92"/><text x="320.0" y="1438.0" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="11" font-weight="600" fill="#2E7D32">Effective</text><rect x="190.0" y="1449.0" width="240" height="54" rx="27" ry="27" fill="#2E7D32"/><text x="310.0" y="1478.7" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="14" font-weight="700" fill="#fff">Control Effective</text><path d="M400,1420 L560,1420 L560,1449" fill="none" stroke="#B3261E" stroke-width="1.8" marker-end="url(#ah-red)"/><text x="566" y="1437" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="11" font-weight="600" fill="#B3261E">Ineffective</text><rect x="520.0" y="1449.0" width="320" height="54" rx="27" ry="27" fill="#8E1B16"/><text x="680.0" y="1478.4" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13" font-weight="700" fill="#fff">Control Ineffective — findings reported</text><path d="M160.0,1392 L92,1392 L92,440 L145.0,440" fill="none" stroke="#B0741B" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#ah-rework)"/><text x="122" y="916" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#B0741B" transform="rotate(-90 122 916)">reviewer can send back (rework)</text><text x="40" y="1541" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="11.5" fill="#5B6573">The gate is a real decision — the team can test OE even when design is ineffective; the design finding still stands either way.</text><text x="40" y="1561" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="11.5" fill="#5B6573">Conclusion is Ineffective if there is any finding (design or OE); Effective only when design is Effective and OE is Effective or validly not tested.</text></svg>