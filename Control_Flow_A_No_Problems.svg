m-ui, -apple-system, Arial, sans-serif" font-size="11.5" fill="#1A1A1A">Form</text><rect x="335.0" y="85" width="18" height="14" rx="3" fill="#B0741B"/><text x="359.0" y="96" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="11.5" fill="#1A1A1A">Annotate</text><rect x="290.0" y="140.0" width="120" height="40" rx="20.0" ry="20.0" fill="#5B6573"/><text x="350.0" y="162.4" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13" font-weight="600" fill="#fff">Start</text><line x1="350.0" y1="180.0" x2="350.0" y2="201.0" stroke="#6B7480" stroke-width="1.8" marker-end="url(#ah-gray)"/><rect x="170.0" y="202.0" width="360" height="56" rx="9" ry="9" fill="#1F3A5F"/><text x="350.0" y="232.4" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13" font-weight="600" fill="#fff">Set up workstep — scope &amp; document requests</text><line x1="350.0" y1="258.0" x2="350.0" y2="279.0" stroke="#6B7480" stroke-width="1.8" marker-end="url(#ah-gray)"/><rect x="170.0" y="280.0" width="360" height="64" rx="9" ry="9" fill="#2E7D6F"/><text x="350.0" y="306.2" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13" font-weight="600" fill="#fff">Test of One — walk one instance,</text><text x="350.0" y="322.7" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13" font-weight="600" fill="#fff">define attributes, capture screenshots</text><line x1="350.0" y1="344.0" x2="350.0" y2="365.0" stroke="#6B7480" stroke-width="1.8" marker-end="url(#ah-gray)"/><rect x="170.0" y="366.0" width="360" height="64" rx="9" ry="9" fill="#2F6DA8"/><text x="350.0" y="392.2" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13" font-weight="600" fill="#fff">Design assessment — methods,</text><text x="350.0" y="408.7" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13" font-weight="600" fill="#fff">walkthrough, 5Ws + H</text><line x1="350.0" y1="430.0" x2="350.0" y2="469.0" stroke="#6B7480" stroke-width="1.8" marker-end="url(#ah-gray)"/><rect x="355.0" y="441.0" width="157.6" height="17" rx="3" fill="#fff" opacity="0.92"/><text x="360.0" y="453.5" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="11" font-weight="600" fill="#6B7480">Design = Effective</text><rect x="170.0" y="492.0" width="360" height="56" rx="9" ry="9" fill="#2F6DA8"/><text x="350.0" y="522.4" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13" font-weight="600" fill="#fff">OE gate = Yes — plan population &amp; sample</text><line x1="350.0" y1="548.0" x2="350.0" y2="569.0" stroke="#6B7480" stroke-width="1.8" marker-end="url(#ah-gray)"/><rect x="170.0" y="570.0" width="360" height="64" rx="9" ry="9" fill="#B0741B"/><text x="350.0" y="596.2" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13" font-weight="600" fill="#fff">Annotate — build samples, mark up</text><text x="350.0" y="612.7" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13" font-weight="600" fill="#fff">evidence, all attributes pass ✓</text><line x1="350.0" y1="634.0" x2="350.0" y2="673.0" stroke="#6B7480" stroke-width="1.8" marker-end="url(#ah-gray)"/><rect x="355.0" y="645.0" width="116.6" height="17" rx="3" fill="#fff" opacity="0.92"/><text x="360.0" y="657.5" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="11" font-weight="600" fill="#6B7480">No exceptions</text><rect x="170.0" y="696.0" width="360" height="56" rx="9" ry="9" fill="#2F6DA8"/><text x="350.0" y="726.4" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13" font-weight="600" fill="#fff">OE conclusion = Effective</text><line x1="350.0" y1="752.0" x2="350.0" y2="773.0" stroke="#6B7480" stroke-width="1.8" marker-end="url(#ah-gray)"/><rect x="170.0" y="774.0" width="360" height="56" rx="9" ry="9" fill="#1F3A5F"/><text x="350.0" y="804.4" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13" font-weight="600" fill="#fff">Mark Effective — no findings — submit</text><line x1="350.0" y1="830.0" x2="350.0" y2="851.0" stroke="#6B7480" stroke-width="1.8" marker-end="url(#ah-gray)"/><rect x="170.0" y="852.0" width="360" height="56" rx="9" ry="9" fill="#5B6573"/><text x="350.0" y="882.4" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="13" font-weight="600" fill="#fff">Reviewer approves</text><line x1="350.0" y1="908.0" x2="350.0" y2="929.0" stroke="#6B7480" stroke-width="1.8" marker-end="url(#ah-gray)"/><rect x="235.0" y="930.0" width="230" height="50" rx="25.0" ry="25.0" fill="#2E7D32"/><text x="350.0" y="957.7" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="14" font-weight="700" fill="#fff">Control Effective</text><text x="40" y="1110" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="11.5" fill="#5B6573">Surfaces in order: Workstep → Test of One → Form → Annotate → Form → Workstep → Reviewer  ·  no loops.</text></svg>